name: Build Android APK (IPTV V4.4 PRO)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Konfiguracja Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Konfiguracja Flutter SDK (kompatybilna z Gradle Groovy)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: "stable"

      - name: Konfiguracja Android SDK i akceptacja licencji
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager | head -n 1)
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"
          yes | flutter doctor --android-licenses || true

      - name: Instalacja Flet i zależności Python
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.2 requests

      - name: Budowanie pliku APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          flet build apk --project "iptv_v4_pro" --description "IPTV V4.4 PRO Remote Cloud" --include-packages flet_video --verbose

      - name: Udostępnij gotowy plik APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-V4.4-PRO-Android-APK
          path: build/apk/*.apk
