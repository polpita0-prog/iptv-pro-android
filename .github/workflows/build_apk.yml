name: Build IPTV V4.4 PRO APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (kompatybilny z Flet 0.24.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build APK with Flet
        run: |
          flet build apk --project "iptv_v4_pro" --description "IPTV V4.4 PRO Remote Cloud" --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-V4.4-PRO-APK
          path: build/apk/*.apk
