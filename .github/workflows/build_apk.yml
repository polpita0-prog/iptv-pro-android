name: Build Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Konfiguracja Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Konfiguracja Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.24.5"
          cache: true

      - name: Instalacja zależności Python i Flet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sprawdzenie składni main.py
        run: |
          python -m py_compile main.py

      - name: Budowanie pakietu APK (Flet Build)
        run: |
          flet build apk --verbose --no-rich-output

      - name: Publikacja gotowego pliku APK w Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-BP-AndroidTV-APK
          path: build/apk/*.apk
          if-no-files-found: error
