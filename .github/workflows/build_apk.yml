name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=1024m"
      JAVA_OPTS: "-Xmx3584m"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK 35 & Licenses
        run: |
          yes | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-34" "build-tools;35.0.0"

      - name: Free up disk & memory space (opcjonalnie przyspiesza build)
        run: |
          sudo swapoff -a
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Flet and dependencies
        run: |
          pip install --upgrade pip
          pip install flet requests
          # Jeśli używasz flet-video, odkomentuj poniższą linię:
          # pip install flet-video

      - name: Build Android APK
        run: |
          flet build apk --no-rich-output --Verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-bp-apk
          path: build/apk/*.apk
