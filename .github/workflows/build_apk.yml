name: Build IPTV BP Dark APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1 pillow requests urllib3
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f wymagania.txt ]; then pip install -r wymagania.txt; fi

      - name: Generuj ciemna stonowana ikone IPTV BP
        run: |
          mkdir -p assets
          python3 -c "
          import os
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGBA', (512, 512), (16, 18, 22, 255))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([16, 16, 496, 496], radius=90, fill='#1c1f26', outline='#52525b', width=12)
          d.rounded_rectangle([36, 36, 476, 476], radius=74, fill='#121418', outline='#2e323d', width=4)
          fp = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          f1 = ImageFont.truetype(fp, 120) if os.path.exists(fp) else ImageFont.load_default()
          f2 = ImageFont.truetype(fp, 130) if os.path.exists(fp) else ImageFont.load_default()
          d.text((256, 195), 'IPTV', fill='#e4e4e7', anchor='mm', font=f1)
          d.text((256, 335), 'BP', fill='#71717a', anchor='mm', font=f2)
          for n in ['icon.png', 'icon_android.png', 'icon_ios.png', 'icon_web.png', 'splash.png', 'splash_android.png']:
              img.save(os.path.join('assets', n))
          "

      - name: Prepare patched Flet template (Gradle + SDK 36 + Android TV VLC)
        run: |
          git clone --branch 0.24.1 https://github.com/flet-dev/flet-build-template.git /tmp/flet-template
          cd /tmp/flet-template
          python3 -c '
          with open("{{cookiecutter.out_dir}}/pubspec.yaml", "r") as f:
              pub = f.read()
          pub = pub.replace("wakelock_plus: ^1.2.5", "wakelock_plus: 1.2.8")
          pub = pub.replace("package_info_plus: ^8.0.0", "package_info_plus: 8.0.2")
          with open("{{cookiecutter.out_dir}}/pubspec.yaml", "w") as f:
              f.write(pub)

          gradle_path = "{{cookiecutter.out_dir}}/android/app/build.gradle"
          with open(gradle_path, "r") as f:
              g = f.read()
          g = g.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdk = 36\n    compileSdkVersion flutter.compileSdkVersion")
          with open(gradle_path, "w") as f:
              f.write(g)

          manifest_path = "{{cookiecutter.out_dir}}/android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              manifest = f.read()
          queries_patch = """    <queries>
                  <package android:name="org.videolan.vlc" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="vlc" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="http" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
          </manifest>"""
          manifest = manifest.replace("</manifest>", queries_patch)
          with open(manifest_path, "w") as f:
              f.write(manifest)
          '
          git config user.email "builder@localhost"
          git config user.name "Builder"
          git commit -am "Fix SDK 36 and Android TV VLC queries"

      - name: Build APK with Flet
        run: |
          flet build apk \
            --project "IPTV BP" \
            --description "IPTV BP V8.2 DARK Remote Cloud" \
            --org "com.iptv.bp.dark" \
            --template /tmp/flet-template \
            --template-ref 0.24.1 \
            --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-BP-DARK-APK
          path: build/apk/*.apk
