name: Build IPTV V4.4 PRO APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare patched Flet template (Gradle + Android TV VLC Queries)
        run: |
          git clone --branch 0.24.1 https://github.com/flet-dev/flet-build-template.git /tmp/flet-template
          cd /tmp/flet-template
          python3 -c '
          # 1. Naprawa zależności w pubspec.yaml
          with open("{{cookiecutter.out_dir}}/pubspec.yaml", "r") as f:
              pub = f.read()
          pub = pub.replace("wakelock_plus: ^1.2.5", "wakelock_plus: 1.2.8")
          pub = pub.replace("package_info_plus: ^8.0.0", "package_info_plus: 8.0.2")
          with open("{{cookiecutter.out_dir}}/pubspec.yaml", "w") as f:
              f.write(pub)

          # 2. Dodanie uprawnień widoczności VLC i schematu vlc:// dla Android TV (Android 11+)
          manifest_path = "{{cookiecutter.out_dir}}/android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              manifest = f.read()

          queries_patch = """
              <queries>
                  <package android:name="org.videolan.vlc" />
                  <package android:name="com.mxtech.videoplayer.ad" />
                  <package android:name="com.mxtech.videoplayer.pro" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="vlc" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="http" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:mimeType="video/*" />
                  </intent>
              </queries>
          </manifest>"""

          manifest = manifest.replace("</manifest>", queries_patch)
          with open(manifest_path, "w") as f:
              f.write(manifest)
          '
          git config user.email "builder@localhost"
          git config user.name "Builder"
          git commit -am "Fix Gradle and enable Android TV VLC intents"

      - name: Build APK with Flet (including flet_video)
        run: |
          flet build apk \
            --project "iptv_v4_pro" \
            --description "IPTV V4.4 PRO Remote Cloud" \
            --include-packages flet_video \
            --template /tmp/flet-template \
            --template-ref 0.24.1 \
            --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-V4.4-PRO-APK
          path: build/apk/*.apk
