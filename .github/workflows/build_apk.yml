name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.24.1" requests urllib3 pillow

      - name: Generate Dark Graphite Icon (IPTV BP)
        run: |
          python - << 'EOF'
          import os
          from PIL import Image, ImageDraw, ImageFont

          os.makedirs("assets", exist_ok=True)
          img = Image.new("RGBA", (512, 512), (16, 18, 22, 255))
          draw = ImageDraw.Draw(img)

          draw.rounded_rectangle([16, 16, 496, 496], radius=90, fill="#1c1f26", outline="#52525b", width=12)
          draw.rounded_rectangle([36, 36, 476, 476], radius=74, fill="#14161b", outline="#3f3f46", width=4)

          font_paths = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
          ]
          f_top = ImageFont.load_default()
          f_bot = ImageFont.load_default()
          for p in font_paths:
              if os.path.exists(p):
                  f_top = ImageFont.truetype(p, 125)
                  f_bot = ImageFont.truetype(p, 135)
                  break

          draw.text((256, 195), "IPTV", fill="#f4f4f5", anchor="mm", font=f_top)
          draw.text((256, 340), "BP", fill="#a1a1aa", anchor="mm", font=f_bot)

          for name in ["icon.png", "icon_android.png", "icon_ios.png", "icon_web.png", "splash.png", "splash_android.png"]:
              img.save(os.path.join("assets", name))
          EOF

      - name: Prepare pyproject.toml for Dark Icon and Video
        run: |
          cat << 'EOF' > pyproject.toml
          [project]
          name = "iptv_bp_dark"
          version = "8.1.0"
          description = "IPTV BP V8.1 DARK Android TV"
          readme = "README.md"
          requires-python = ">=3.9"
          dependencies = [
              "flet==0.24.1",
              "requests>=2.31.0",
              "urllib3",
          ]

          [tool.flet]
          org = "com.iptv.bp.dark"
          product = "IPTV BP"
          company = "IPTV BP Cloud"
          copyright = "Copyright (C) 2026"

          [tool.flet.app]
          path = "."
          assets_dir = "assets"

          [tool.flet.android]
          adaptive_icon_background = "#14161b"

          [tool.flet.splash]
          color = "#101216"
          dark_color = "#101216"
          web = false
          ios = false
          android = true

          [tool.flet.flutter.pubspec.dependency_overrides]
          wakelock_plus = "1.2.8"
          wakelock_plus_platform_interface = "1.2.1"
          package_info_plus = "8.0.2"
          package_info_plus_platform_interface = "3.0.1"
          web = "0.5.1"
          EOF

      - name: Build Android APK with Flet Video
        run: |
          flet build apk --include-packages flet_video --project "IPTV BP" --org "com.iptv.bp.dark" --yes

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-BP-Dark-APK
          path: build/apk/*.apk
