[project]
name = "iptv_bp_pro"
version = "7.5.0"
description = "IPTV BP V7.5 PRO Android TV"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flet==0.24.1",
    "requests>=2.31.0",
]

[tool.flet]
org = "com.iptv.bp"
product = "IPTV BP"
company = "IPTV BP Remote Cloud"
copyright = "Copyright (C) 2026"

[tool.flet.app]
path = "."
assets_dir = "assets"

[tool.flet.android]
adaptive_icon_background = "#ea580c"

[tool.flet.splash]
color = "#0b1f15"
dark_color = "#0b1f15"
web = false
ios = false
android = true

[tool.flet.flutter.pubspec.dependency_overrides]
wakelock_plus = "1.2.8"
wakelock_plus_platform_interface = "1.2.1"
package_info_plus = "8.0.2"
package_info_plus_platform_interface = "3.0.1"
web = "0.5.1"
